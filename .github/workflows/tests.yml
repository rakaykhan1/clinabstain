name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: pytest -q
      # Scorer sanity check: the oracle must be perfect and always-answer must not be.
      - run: python run.py --model baseline:oracle
      - run: python run.py --model baseline:always-answer
      - run: python run.py --model baseline:always-escalate
      - run: python tools/validate_dataset.py data/items.jsonl
      - run: python tools/validate_dataset.py data/items_local.jsonl
      # Every NHS quotation must still be a verbatim extract of its stored page, and the passages file must match.
      - run: python tools/build_passages.py && git diff --exit-code data/passages.jsonl
